[project]
name = "shanhai-image-shim"
version = "0.1.0"
description = "ComfyUI 图像生成中转层(OpenAI 兼容 images_api)"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "python-multipart",   # /v1/images/edits 收 multipart 上传,缺了该路由 500
]

# 这是散装脚本(只有 main.py),不是可安装的包:告诉 uv 只装依赖、不构建/安装本项目。
[tool.uv]
package = false
