[project]
name = "shanhai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-dotenv>=1.0",  # config.load_env 直接依赖(勿只靠 pydantic-settings 传递)
  "typer>=0.12",
  "pillow>=10.3",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "bcrypt>=4.0",  # 口令哈希(auth.py)
  "itsdangerous>=2.0",  # Starlette SessionMiddleware 签名 cookie 依赖
  "python-multipart>=0.0.9",  # FastAPI UploadFile 依赖:缺它时**定义路由那一刻**就抛
  # RuntimeError,整个 app import 失败、全量测试一起挂,且报错与上传功能毫无关系,极难定位。
]

[project.scripts]
shanhai = "shanhai.cli:app"
shanhai-web = "shanhai.api:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shanhai"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E401", "E702"]
"spike/**" = ["E702"]
